# ==========================================================================
# PRODUCTION NGINX CONFIG (TLS)
#
# Before first start:
#   1. Replace every "your-domain.example.com" below with your real domain.
#   2. Obtain the initial certificate (one-time), e.g.:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
#          certbot certonly --webroot -w /var/www/certbot -d your-domain.example.com
#   3. Reload nginx:  docker compose ... exec nginx nginx -s reload
#
# The `certbot` service (see docker-compose.prod.yml) auto-renews certs.
# ==========================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Rate limiting (10 req/s per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Websocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s;

    # ----------------------------------------------------------------------
    # HTTP :80  — ACME challenge + permanent redirect to HTTPS
    # ----------------------------------------------------------------------
    server {
        listen 80;
        server_name your-domain.example.com;

        # Let's Encrypt webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------------
    # HTTPS :443 — main entrypoint
    # ----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name your-domain.example.com;

        ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

        # Modern, secure TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        # Limit request body to mitigate abuse
        client_max_body_size 1m;

        # Stream Service (SSE)
        location /api/v1/stream {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_stream stream-service:8000;
            proxy_pass http://$upstream_stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Auth Service
        location /api/v1/auth {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user user-service:8000;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service
        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user user-service:8000;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Wallet Service
        location /api/v1/wallets {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_wallet wallet-service:8000;
            proxy_pass http://$upstream_wallet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Query Service (Symbols)
        location /api/v1/symbols {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_query query-service:8000;
            proxy_pass http://$upstream_query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway (REST)
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_api api-gateway:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification WS Server (WebSockets)
        location /ws/ {
            proxy_pass http://notification-ws:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Frontend (Next.js)
        location / {
            set $upstream_frontend frontend:3000;
            proxy_pass http://$upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
