worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Глобальная зона лимитирования (10 запросов в секунду с одного IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Websocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Stream Service (SSE)
        location /api/v1/stream {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_stream stream-service:8000;
            proxy_pass http://$upstream_stream;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Auth Service
        location /api/v1/auth {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user user-service:8000;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # User Service
        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user user-service:8000;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Wallet Service
        location /api/v1/wallets {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_wallet wallet-service:8000;
            proxy_pass http://$upstream_wallet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Query Service (Symbols)
        location /api/v1/symbols {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_query query-service:8000;
            proxy_pass http://$upstream_query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway (REST)
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_api api-gateway:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Notification WS Server (WebSockets)
        location /ws/ {
            proxy_pass http://notification-ws:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie;
        }

        # Frontend (Next.js)
        location / {
            set $upstream_frontend frontend:3000;
            proxy_pass http://$upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
