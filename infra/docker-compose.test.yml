version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 2s
      timeout: 5s
      retries: 10

  test-kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://test-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@test-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: development
    environment:
      - POSTGRES_URL=postgresql+asyncpg://test_user:test_password@test-db:5432/test_db
      - KAFKA_BROKER=test-kafka:9092
      - TESTING=1
    depends_on:
      test-db:
        condition: service_healthy
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/api-gateway:/app
    # 1. Запускаем миграции Alembic на тестовой БД
    # 2. Запускаем pytest
    command: >
      bash -c "alembic upgrade head && pytest -v"

  trading-engine:
    build:
      context: ../services/trading-engine
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
    depends_on:
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/trading-engine:/app
