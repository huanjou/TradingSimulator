version: '3.8'

services:
  postgres-primary:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: test_user
      POSTGRESQL_PASSWORD: test_password
      POSTGRESQL_DATABASE: test_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_USERNAME: test_user
      POSTGRESQL_PASSWORD: test_password
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d postgres" ]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 5s
      retries: 10

  test-kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://test-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@test-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
      - QUERY_SERVICE_URL=http://query-service:8000
      - QUERY_SERVICE_GRPC_URL=query-service:50051
      - TESTING=1
      - ENV=test
    depends_on:
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/api-gateway:/app
    command: >
      bash -c "pytest -v"

  trading-engine:
    build:
      context: ../services/trading-engine
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
    depends_on:
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/trading-engine:/app

  ledger-writer:
    build:
      context: ../services/ledger-writer
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - POSTGRES_URL=postgresql+asyncpg://test_user:test_password@postgres-primary:5432/test_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/ledger-writer:/app

  query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
      target: development
    environment:
      - POSTGRES_URL=postgresql+asyncpg://test_user:test_password@postgres-replica:5432/test_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/query-service:/app

  test-trading-engine:
    build:
      context: ../services/trading-engine
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - TESTING=1
      - ENV=test
    depends_on:
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/trading-engine:/app
    command: >
      bash -c "pytest -v"

  test-ledger-writer:
    build:
      context: ../services/ledger-writer
      dockerfile: Dockerfile
      target: development
    environment:
      - KAFKA_BROKER=test-kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - POSTGRES_URL=postgresql+asyncpg://test_user:test_password@postgres-primary:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - TESTING=1
      - ENV=test
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      test-kafka:
        condition: service_healthy
    volumes:
      - ../services/ledger-writer:/app
    command: >
      bash -c "pytest -v"

  test-query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
      target: development
    environment:
      - POSTGRES_URL=postgresql+asyncpg://test_user:test_password@postgres-replica:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - TESTING=1
      - ENV=test
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/query-service:/app
    command: >
      bash -c "pytest -v"
