services:
  # ==========================================
  # ИНФРАСТРУКТУРА
  # ==========================================
  postgres:
    restart: always

  kafka:
    restart: always

  redis:
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"

  # ==========================================
  # МИКРОСЕРВИСЫ (Переопределение для Production)
  # ==========================================
  api-gateway:
    build:
      target: production
    restart: always
    # Очищаем проброс кода
    volumes: !reset []
    environment:
      - ENV=production
      - LOG_LEVEL=INFO

  frontend:
    build:
      target: production
    restart: always
    # Очищаем проброс кода
    volumes: !reset []
    environment:
      - NODE_ENV=production

  matching-engine:
    restart: always

  ledger:
    restart: always

  user-service:
    restart: always
    # Skip create-superuser in prod; rely on migrations and manual setup
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
