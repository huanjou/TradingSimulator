# ==========================================================================
# PRODUCTION OVERRIDE
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardening applied here (do NOT weaken):
#   * Only nginx is published to the host (80/443). Every other service is
#     reachable only inside the internal `exchange_net` docker network.
#   * All secrets are REQUIRED (`${VAR:?message}`) — the stack refuses to
#     start if they are missing, so no insecure dev defaults can leak to prod.
#   * ENVIRONMENT/ENV=production so cookies become Secure and secret
#     validators are enforced.
#   * Redis requires a password.
# ==========================================================================
services:
  # ==========================================
  # ИНФРАСТРУКТУРА
  # ==========================================
  # --------------------------------------------------------------------
  # PostgreSQL HA (prod-only):
  #   * synchronous replication — the replica confirms every commit, so a
  #     manual promotion (postgres/promote-replica.sh) loses ZERO
  #     acknowledged writes;
  #   * physical replication slot (replica_slot) — WAL needed by the
  #     standby is never recycled, guaranteed catch-up after downtime;
  #   * PgBouncer in front of the primary — services reconnect through a
  #     stable endpoint, failover = re-point ONE service (pgbouncer).
  # Failover runbook: infra/postgres/promote-replica.sh
  # --------------------------------------------------------------------
  postgres-primary:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    ports: !reset []
    volumes:
      - pg_primary_data:/bitnami/postgresql
      - ./postgres/init-replication-slot.sh:/docker-entrypoint-initdb.d/00-replication-slot.sh:ro
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICA_USER:?POSTGRES_REPLICA_USER is required}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:?POSTGRES_REPLICA_PASSWORD is required}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Synchronous replication: commit is acknowledged only after the
      # standby confirmed it. NOTE: with a single sync standby, writes
      # BLOCK while the replica is down — that is the intended durability
      # trade-off for a ledger (no acknowledged write can ever be lost).
      POSTGRESQL_SYNCHRONOUS_COMMIT_MODE: "on"
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: 1
      # Slot capacity + bounded WAL fallback if the slot is dropped.
      POSTGRESQL_EXTRA_FLAGS: "-c max_replication_slots=5 -c wal_keep_size=512MB"

  postgres-replica:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    ports: !reset []
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICA_USER:?POSTGRES_REPLICA_USER is required}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:?POSTGRES_REPLICA_PASSWORD is required}
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Stream WAL through the primary's replication slot (created by
      # postgres/init-replication-slot.sh) — guaranteed WAL retention.
      POSTGRESQL_EXTRA_FLAGS: "-c primary_slot_name=replica_slot"

  # Connection pooler in front of the primary. All writer services connect
  # here (pgbouncer:6432) instead of postgres-primary directly:
  #   * transaction pooling absorbs connection storms (400 clients -> 25
  #     server connections);
  #   * transparent reconnection — after a failover only THIS service is
  #     re-pointed to the promoted node, apps just reconnect.
  pgbouncer:
    image: bitnami/pgbouncer:1.22
    container_name: exchange_pgbouncer
    restart: always
    environment:
      POSTGRESQL_HOST: postgres-primary
      POSTGRESQL_PORT_NUMBER: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGBOUNCER_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 400
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 300
      # Required for asyncpg with transaction pooling: PgBouncer >=1.21
      # tracks protocol-level prepared statements across server conns.
      PGBOUNCER_MAX_PREPARED_STATEMENTS: 200
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - exchange_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Single-broker kafka from the base compose is disabled in prod; the HA
  # 3-broker KRaft cluster below (kafka-1..3, RF=3, min.insync.replicas=2)
  # replaces it. No prod service depends on `kafka`, so it never starts.
  kafka:
    profiles: ["disabled"]

  kafka-1:
    image: apache/kafka:3.7.0
    user: "root"
    container_name: exchange_kafka_1
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-1-data:/tmp/kafka-logs
    networks:
      - exchange_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  kafka-2:
    image: apache/kafka:3.7.0
    user: "root"
    container_name: exchange_kafka_2
    environment:
      KAFKA_NODE_ID: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-2-data:/tmp/kafka-logs
    networks:
      - exchange_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  kafka-3:
    image: apache/kafka:3.7.0
    user: "root"
    container_name: exchange_kafka_3
    environment:
      KAFKA_NODE_ID: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-3-data:/tmp/kafka-logs
    networks:
      - exchange_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports: !reset []
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # НАБЛЮДАЕМОСТЬ (не публикуем наружу; доступ через SSH-туннель/VPN)
  # ==========================================
  jaeger:
    restart: always
    ports: !reset []

  otel-collector:
    restart: always
    ports: !reset []

  prometheus:
    restart: always
    ports: !reset []

  loki:
    restart: always
    ports: !reset []

  cadvisor:
    restart: always
    ports: !reset []

  node-exporter:
    restart: always
    ports: !reset []

  promtail:
    restart: always

  grafana:
    restart: always
    ports: !reset []
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: exchange_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew certificates twice a day; nginx picks up new certs on reload.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - exchange_net

  # ==========================================
  # МИКРОСЕРВИСЫ (Переопределение для Production)
  # ==========================================
  api-gateway:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy

  ledger-writer:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes: !reset []
    depends_on: !override
      pgbouncer:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
      # Writes go through PgBouncer (pooling + stable failover endpoint).
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}

  cache-writer:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes: !reset []
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy

  query-service:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CORS_ORIGINS=["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]
      # Reads stay on the replica (POSTGRES_URL from base compose);
      # only the primary (write) connection goes through PgBouncer.
      - POSTGRES_PRIMARY_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}

  trading-engine:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    volumes: !reset []
    depends_on: !override
      pgbouncer:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
      # Prod Redis requires auth; without this the engine can't read/write its
      # recovery snapshot and every restart would cold-start (money-loss risk).
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Durable snapshot writes go through PgBouncer.
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}

  market-data:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes: !reset []
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  stream-service:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    environment:
      - LOG_LEVEL=INFO
      - BACKEND_CORS_ORIGINS=["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  notification-ws:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports: !reset []
    volumes: !reset []
    environment:
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ORIGINS=["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  user-service:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CORS_ORIGINS=["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
    # Skip create-superuser in prod; rely on migrations and manual setup
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  wallet-service:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CORS_ORIGINS=["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on: !override
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  frontend:
    build:
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports: !reset []
    volumes: !reset []
    environment:
      - NODE_ENV=production

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
