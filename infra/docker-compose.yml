services:
  # ==========================================
  # ИНФРАСТРУКТУРА
  # ==========================================
  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: exchange_postgres_primary
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/bitnami/postgresql
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ledger_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: exchange_postgres_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: password
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - pg_replica_data:/bitnami/postgresql
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    user: "root"
    container_name: exchange_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exchange_redis
    ports:
      - "6379:6379"
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Наблюдаемость
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exchange_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC receiver
    networks:
      - exchange_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: exchange_otel_collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "8889:8889" # Prometheus метрики
    depends_on:
      - jaeger
    networks:
      - exchange_net

  prometheus:
    image: prom/prometheus:latest
    container_name: exchange_prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - exchange_net
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: exchange_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - exchange_net
    depends_on:
      - prometheus

  # ==========================================
  # Прокси
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: exchange_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - exchange_net

  # ==========================================
  # МИКРОСЕРВИСЫ
  # ==========================================
  ledger-migrations:
    build:
      context: ../services/ledger-writer
      dockerfile: Dockerfile
      target: development
    container_name: exchange_ledger_migrations
    command: [ "poetry", "run", "alembic", "upgrade", "head" ]
    environment:
      - POSTGRES_URL=postgresql+asyncpg://admin:password@postgres-primary:5432/ledger_db
    volumes:
      - ../services/ledger-writer:/app
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - exchange_net

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: exchange_api_gateway
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - QUERY_SERVICE_URL=http://query-service:8000
      - QUERY_SERVICE_GRPC_URL=query-service:50051
      - ENV=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ../services/api-gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - exchange_net

  ledger-writer:
    build:
      context: ../services/ledger-writer
      dockerfile: Dockerfile
      target: development
    container_name: exchange_ledger_writer
    environment:
      - KAFKA_BROKER=kafka:9092
      - POSTGRES_URL=postgresql+asyncpg://admin:password@postgres-primary:5432/ledger_db
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      ledger-migrations:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../services/ledger-writer:/app
    networks:
      - exchange_net

  query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
      target: development
    container_name: exchange_query_service
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://admin:password@postgres-replica:5432/ledger_db
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/query-service:/app
    networks:
      - exchange_net

  trading-engine:
    build:
      context: ../services/trading-engine
      dockerfile: Dockerfile
      target: development
    container_name: exchange_trading_engine
    environment:
      - KAFKA_BROKER=kafka:9092
      - ENV=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/trading-engine:/app
    networks:
      - exchange_net

  frontend:
    build:
      context: ../frontend
      target: development
    container_name: exchange_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - exchange_net

networks:
  exchange_net:
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica_data:
  kafka_data:
  prometheus_data:
  grafana_data:
