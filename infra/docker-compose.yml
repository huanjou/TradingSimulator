services:
  # ==========================================
  # ИНФРАСТРУКТУРА
  # ==========================================
  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: exchange_postgres_primary
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICA_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-repl_password}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-admin}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-ledger_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/bitnami/postgresql
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ledger_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: exchange_postgres_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICA_USER:-repl_user}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-repl_password}
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-admin}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - pg_replica_data:/bitnami/postgresql
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    user: "root"
    container_name: exchange_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exchange_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exchange_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Наблюдаемость
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exchange_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC receiver
    networks:
      - exchange_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: exchange_otel_collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - SAMPLING_PERCENTAGE=${SAMPLING_PERCENTAGE:-100}
    ports:
      - "8889:8889" # Prometheus метрики
    depends_on:
      - jaeger
    networks:
      - exchange_net

  prometheus:
    image: prom/prometheus:latest
    container_name: exchange_prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - exchange_net
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:latest
    container_name: exchange_loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - exchange_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: exchange_cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - exchange_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: exchange_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - exchange_net

  promtail:
    image: grafana/promtail:latest
    container_name: exchange_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - exchange_net

  grafana:
    image: grafana/grafana:latest
    container_name: exchange_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    networks:
      - exchange_net
    depends_on:
      - prometheus

  # ==========================================
  # Прокси
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: exchange_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
      - user-service
      - query-service
      - stream-service
      - notification-ws
      - wallet-service
    networks:
      - exchange_net

  # ==========================================
  # МИКРОСЕРВИСЫ
  # ==========================================


  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: exchange_api_gateway
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - QUERY_SERVICE_URL=http://query-service:8000
      - QUERY_SERVICE_GRPC_URL=query-service:50051
      - REDIS_URL=redis://redis:6379/0
      - ENV=${APP_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    command: >
      sh -c "python -m app.cli seed-symbols && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../services/api-gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exchange_net

  ledger-writer:
    build:
      context: ../services/ledger-writer
      dockerfile: Dockerfile
      target: development
    container_name: exchange_ledger_writer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres-primary:5432/${POSTGRES_DB:-ledger_db}
      - ENV=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:

      postgres-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../services/ledger-writer:/app
    networks:
      - exchange_net

  cache-writer:
    build:
      context: ../services/cache-writer
      dockerfile: Dockerfile
      target: development
    container_name: exchange_cache_writer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - REDIS_URL=redis://redis:6379/0
      - ENV=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../services/cache-writer:/app
    networks:
      - exchange_net

  query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
      target: development
    container_name: exchange_query_service
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres-replica:5432/${POSTGRES_DB:-ledger_db}
      - POSTGRES_PRIMARY_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres-primary:5432/${POSTGRES_DB:-ledger_db}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/query-service:/app
    networks:
      - exchange_net

  trading-engine:
    build:
      context: ../services/trading-engine
      dockerfile: Dockerfile
      target: development
    container_name: exchange_trading_engine
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - KAFKA_MARKET_DATA_TOPIC=market_data
      - ENV=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/trading-engine:/app
    networks:
      - exchange_net

  market-data:
    build:
      context: ../services/market-data
      dockerfile: Dockerfile
      target: development
    container_name: exchange_market_data
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_MARKET_DATA_TOPIC=market_data
      - MARKET_PROVIDER=binance
      - MARKET_SYMBOLS=BTC/USD,ETH/USD,SOL/USD
      - ENV=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/market-data:/app
    networks:
      - exchange_net

  stream-service:
    build:
      context: ../services/stream-service
      dockerfile: Dockerfile
    container_name: exchange_stream_service
    ports:
      - "8002:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MARKET_DATA_TOPIC=market_data
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/stream-service:/app
    networks:
      - exchange_net

  notification-ws:
    build:
      context: ../services/notification-ws
      dockerfile: Dockerfile
    container_name: exchange_notification_ws
    ports:
      - "8004:8000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_ORDER_UPDATES_TOPIC=order_updates
      - KAFKA_TRADES_TOPIC=trades
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/notification-ws:/app
    networks:
      - exchange_net

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: exchange_user_service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres-primary:5432/${POSTGRES_DB:-ledger_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123}
      - ENVIRONMENT=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@admin.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    command: >
      sh -c "python -m app.cli create-superuser && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - ../services/user-service:/app
    networks:
      - exchange_net

  wallet-service:
    build:
      context: ../services/wallet-service
      dockerfile: Dockerfile
    container_name: exchange_wallet_service
    ports:
      - "8005:8000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_WALLET_COMMANDS_TOPIC=wallet_commands
      - ENVIRONMENT=${APP_ENV:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../services/wallet-service:/app
    networks:
      - exchange_net

  frontend:
    build:
      context: ../frontend
      target: development
    container_name: exchange_frontend
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - exchange_net

networks:
  exchange_net:
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
