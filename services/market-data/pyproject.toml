[tool.poetry]
package-mode = false

[project]
name = "market-data"
version = "0.1.0"
description = "Market data ingestion service connected to Binance"
authors = [
    {name = "TradingSimulator"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "opentelemetry-api (>=1.24.0,<2.0.0)",
    "opentelemetry-sdk (>=1.24.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.24.0,<2.0.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "lz4 (>=4.4.5,<5.0.0)",
    "websockets (>=14.0,<15.0)",
    "httpx (>=0.27.0,<1.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-mock = ">=3.14.0,<4.0.0"
pytest-xdist = ">=3.5.0,<4.0.0"
factory-boy = "^3.3.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
