[tool.poetry]
package-mode = false
name = "ledger-writer"
version = "0.1.0"
description = "Ledger Writer for Trading Simulator"
authors = ["Huan Jou <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.138.2"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
sqlalchemy = "^2.0.51"
asyncpg = "^0.31.0"
alembic = "^1.13.1"
redis = "^5.0.4"

aiokafka = "^0.10.0"
pydantic-settings = "^2.14.2"
structlog = "^24.1.0"
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-exporter-otlp = "^1.24.0"
setuptools = "^70.0.0"
orjson = "^3.11.9"
lz4 = "^4.4.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
httpx = "^0.25.0"
pytest-asyncio = "^0.21.1"
pytest-xdist = "^3.5.0"
ruff = "^0.4.5"
factory-boy = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
