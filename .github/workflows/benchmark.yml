name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0' # Run at 04:00 UTC every Sunday

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start infrastructure
        run: |
          # Build/start only the benchmarked services and their dependencies;
          # the full stack (frontend, observability) exhausts the CI runner.
          make benchmark-up
          echo "Waiting for the benchmarked services to report healthy..."
          ready=0
          for attempt in $(seq 1 60); do
            engine=$(docker inspect -f '{{.State.Health.Status}}' exchange_trading_engine 2>/dev/null || echo missing)
            ledger=$(docker inspect -f '{{.State.Health.Status}}' exchange_ledger_writer 2>/dev/null || echo missing)
            echo "attempt ${attempt}: trading-engine=${engine} ledger-writer=${ledger}"
            if [ "$engine" = "healthy" ] && [ "$ledger" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Services did not become healthy within 5 minutes"
            cd infra && docker compose ps
            docker logs --tail 200 exchange_trading_engine || true
            docker logs --tail 200 exchange_ledger_writer || true
            exit 1
          fi

      - name: Run Trading Engine Core Benchmark
        run: make benchmark-engine-core

      - name: Run Trading Engine Kafka Benchmark
        run: make benchmark-engine-kafka

      - name: Run Ledger Writer Benchmark
        run: make benchmark-ledger

      - name: Cleanup
        if: always()
        run: make clean
