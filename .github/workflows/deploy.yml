name: Deploy

# Triggers:
# 1. Automatically after CI succeeds on main
# 2. Manually via GitHub UI (Actions → Deploy → Run workflow)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          POSTGRES_REPLICA_USER: dummy
          POSTGRES_REPLICA_PASSWORD: dummy
          POSTGRES_USER: dummy
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: dummy
          REDIS_PASSWORD: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
          JWT_SECRET: dummy
          PUBLIC_ORIGIN: dummy
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml build
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml push

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd /opt/TradingSimulator

            # Добавляем github.com в список известных хостов, чтобы git fetch не падал
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Login to GHCR to pull private/internal images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull pre-built images (zero CPU/RAM overhead on server)
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull

            # Recreate containers without downtime (rolling update)
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d

            # Wait for health checks
            echo "Waiting for services to be healthy..."
            sleep 30

            # Verify nginx is responding
            curl -sk https://localhost/ > /dev/null 2>&1 && echo "Deploy successful" || echo "Health check failed"

            # Cleanup old images
            docker image prune -f
