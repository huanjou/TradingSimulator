name: Deploy

# Triggers:
# 1. Automatically after CI succeeds on main
# 2. Manually via GitHub UI (Actions → Deploy → Run workflow)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Skip if triggered by workflow_run and CI failed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 60m
          script: |
            set -e
            cd /opt/TradingSimulator

            # Добавляем github.com в список известных хостов, чтобы git fetch не падал
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Pull pre-built external images first
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull

            # Stop running containers to free up RAM before building
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml down

            # Rebuild images sequentially to prevent CPU starvation and Poetry timeouts
            for service in $(docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config --services); do
              docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml build $service
            done
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d

            # Wait for health checks
            echo "Waiting for services to be healthy..."
            sleep 30

            # Verify nginx is responding
            curl -sk https://localhost/ > /dev/null 2>&1 && echo "Deploy successful" || echo "Health check failed"

            # Cleanup old images
            docker image prune -f
