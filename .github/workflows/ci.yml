name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/load-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Integration Tests
        run: make test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dependency vulnerabilities (poetry.lock / package-lock.json),
      # leaked secrets, and Dockerfile/compose misconfigurations.
      - name: Trivy scan (deps, secrets, misconfig)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table
